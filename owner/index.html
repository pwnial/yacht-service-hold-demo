<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tonight’s holds — Yacht Service Ltd</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="bar">
    <div>
      <p class="eyebrow">Owner</p>
      <h1>Tonight’s holds</h1>
    </div>
    <a class="quiet" href="../">Customer page</a>
  </header>

  <main class="card">
    <form id="pin-form">
      <label>PIN
        <input name="pin" inputmode="numeric" autocomplete="off" maxlength="8" required />
      </label>
      <button type="submit">Open list</button>
    </form>

    <div id="list-wrap" hidden>
      <p class="lede" id="count"></p>
      <ol id="holds" class="holds"></ol>
    </div>
  </main>

  <footer>PIN is 2267 in this demo. Not a live shop.</footer>
  <script src="../app.js"></script>
</body>
</html>
